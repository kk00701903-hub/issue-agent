<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Hub</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1f2328; --mute:#6b7280; --line:#e3e1db; --accent:#073190; --ok:#1a7f4b; --warn:#b26a00; --bad:#c0362c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181b; --card:#1f2226; --ink:#e8e8e6; --mute:#9aa0a6; --line:#33373c; --accent:#7ea2ff; --ok:#4cc38a; --warn:#e0a040; --bad:#ff7b72; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, "Malgun Gothic", sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:2; }
  header h1 { font-size:17px; margin:0; }
  .logo { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:8px; background:var(--accent); color:#fff; font-weight:800; font-size:12px; letter-spacing:.5px; }
  .banner { padding:8px 20px; font-size:13px; background:#fff6df; color:#6b4e00; border-bottom:1px solid #e6c77a; }
  .banner.bad { background:#fbebeb; color:#8a1d14; border-color:#e5a39b; }
  @media (prefers-color-scheme: dark) { .banner { background:#3a3220; color:#f0d58a; } .banner.bad { background:#3a2020; color:#ff9b93; } }
  .login { max-width:360px; margin:60px auto; }
  nav { display:flex; gap:4px; }
  nav button { border:0; background:none; color:var(--mute); padding:8px 14px; border-radius:8px; font:inherit; cursor:pointer; }
  nav button.on { background:var(--bg); color:var(--ink); font-weight:600; }
  nav .badge { background:var(--bad); color:#fff; border-radius:10px; padding:0 7px; font-size:12px; margin-left:4px; }
  .spacer { flex:1; }
  .small { font-size:13px; color:var(--mute); }
  main { padding:20px; max-width:1100px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card h3 { margin:0 0 4px; font-size:15px; }
  .pill { display:inline-block; border-radius:10px; padding:1px 9px; font-size:12px; border:1px solid var(--line); color:var(--mute); }
  .pill.active { color:var(--ok); border-color:var(--ok); }
  .pill.optional { color:var(--accent); border-color:var(--accent); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .bar { height:8px; background:var(--line); border-radius:6px; overflow:hidden; margin:6px 0 2px; }
  .bar i { display:block; height:100%; background:var(--accent); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-weight:600; color:var(--mute); font-size:13px; }
  tr.click { cursor:pointer; } tr.click:hover { background:var(--bg); }
  .st-awaiting_approval { color:var(--warn); } .st-approved { color:var(--ok); }
  .st-validation_failed, .st-error, .st-rejected { color:var(--bad); }
  .split { display:grid; grid-template-columns: 340px 1fr; gap:16px; align-items:start; }
  @media (max-width: 800px) { .split { grid-template-columns:1fr; } }
  .err { color:var(--bad); } .wrn { color:var(--warn); }
  ul.clean { margin:6px 0; padding-left:18px; }
  button.btn { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:7px 14px; font:inherit; cursor:pointer; }
  button.btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.btn:disabled { opacity:.45; cursor:not-allowed; }
  input[type=text] { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:7px 10px; font:inherit; width:100%; }
  pre { white-space:pre-wrap; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; font-size:13px; max-height:420px; overflow:auto; }
  .kind-blocked { color:var(--bad); } .kind-status { color:var(--accent); }
  #log td:nth-child(-n+3), #log th:nth-child(-n+3) { white-space:nowrap; width:1%; }
  .flow { display:flex; flex-wrap:wrap; gap:0; align-items:stretch; margin:6px 0 4px; }
  .step { position:relative; min-width:120px; flex:1; border:1px solid var(--line); background:var(--card); padding:8px 10px; margin:0 14px 10px 0; border-radius:10px; }
  .step::after { content:"→"; position:absolute; right:-13px; top:50%; transform:translateY(-50%); color:var(--mute); }
  .step:last-child::after { content:""; }
  .step b { display:block; font-size:13px; }
  .step .who { font-size:12px; color:var(--mute); }
  .step.k-human { background:#fff6df; border-color:#e6c77a; } .step.k-code { border-style:dashed; } .step.k-browser { border-color:var(--accent); }
  @media (prefers-color-scheme: dark) { .step.k-human { background:#3a3220; border-color:#8a7340; } }
  .step.done { opacity:.55; } .step.now { outline:2px solid var(--accent); } .step.now b::before { content:"▶ "; color:var(--accent); }
  .legend span { margin-right:12px; }
  /* 흐름 편집기 v2 */
  main:has(#flow:not(.hide)) { max-width:1500px; }
  .fl-top { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .fl-chips { display:flex; gap:6px; flex-wrap:wrap; }
  .fl-chip { border:1px solid var(--line); background:var(--card); color:var(--mute); border-radius:999px; padding:6px 14px; font:inherit; font-size:13px; cursor:pointer; }
  .fl-chip.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .fl-tools { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .fl-btn { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:9px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; }
  .fl-btn:hover { border-color:var(--accent); }
  .fl-btn.icon { width:32px; padding:6px 0; }
  .fl-btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .fl-btn.ai { background:linear-gradient(135deg,#6b4dff,#d6409f); border:0; color:#fff; font-weight:600; box-shadow:0 2px 10px rgba(107,77,255,.3); }
  .fl-btn:disabled { opacity:.6; cursor:wait; }
  .fl-sep { width:1px; height:22px; background:var(--line); margin:0 2px; }
  .fl-status { margin-left:4px; }
  .fl-ai { border-radius:14px; padding:14px 16px; margin-bottom:12px; background:linear-gradient(135deg,rgba(107,77,255,.08),rgba(214,64,159,.08)); border:1px solid rgba(107,77,255,.25); }
  .fl-ai-head { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; margin-bottom:8px; }
  .fl-ai-input { width:100%; box-sizing:border-box; font:inherit; border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--card); color:var(--ink); resize:vertical; }
  .fl-note { font-size:13px; padding:8px 12px; border-radius:10px; margin-bottom:10px; background:rgba(107,77,255,.08); border:1px solid rgba(107,77,255,.25); }
  .fl-note.warn { background:#fff6df; border-color:#e6c77a; color:#6b4e00; }
  .fl-body { display:flex; gap:12px; align-items:flex-start; }
  .fl-side { width:190px; flex:none; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; max-height:660px; overflow:auto; box-sizing:border-box; }
  .fl-side.props { width:230px; }
  .fl-side-h { font-weight:700; margin-bottom:6px; }
  .fl-side-s { font-size:11px; color:var(--mute); letter-spacing:.5px; margin:10px 0 4px; }
  .fl-pal { display:flex; gap:8px; align-items:center; width:100%; text-align:left; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:7px 8px; margin:4px 0; cursor:pointer; font:inherit; }
  .fl-pal:hover { border-color:var(--accent); }
  .fl-pal b { display:block; font-size:12.5px; } .fl-pal small { display:block; font-size:11px; color:var(--mute); }
  .fl-ic { flex:none; display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:7px; font-size:12px; font-weight:700; color:#fff; background:var(--k); }
  .k-agent { --k:#4f6bff; } .k-code { --k:#6b7280; } .k-browser { --k:#0ea5a4; } .k-human { --k:#e0a020; } .k-note { --k:#9ca3af; }
  .fl-canvas-wrap { flex:1; min-width:0; height:660px; overflow:auto; position:relative; border-radius:14px; border:1px solid var(--line);
    background-color:#fbfaf7; background-image:radial-gradient(#d9d6cd 1px, transparent 1px); background-size:22px 22px; }
  @media (prefers-color-scheme: dark) { .fl-canvas-wrap { background-color:#1a1c1f; background-image:radial-gradient(#33373c 1px, transparent 1px); } }
  .fl-canvas { position:relative; }
  .fl-edges { position:absolute; left:0; top:0; pointer-events:none; overflow:visible; }
  .fl-e { fill:none; stroke:#b8bcc6; stroke-width:2.2; }
  .fl-e.hot { stroke:var(--accent); stroke-width:2.8; }
  .fl-e.sel { stroke:var(--bad); stroke-width:3; }
  .fl-e-flow { fill:none; stroke:var(--accent); stroke-width:2.2; stroke-dasharray:2 14; stroke-linecap:round; opacity:.35; animation:fl-dash 1.6s linear infinite; }
  .fl-e-flow.hot { opacity:.9; animation-duration:.7s; }
  @keyframes fl-dash { to { stroke-dashoffset:-32; } }
  .fl-arrow { fill:#b8bcc6; } .fl-arrow.hot { fill:var(--accent); }
  .fl-dot { fill:var(--accent); opacity:.55; } .fl-dot.hot { opacity:1; }
  .fl-e-hit { fill:none; stroke:transparent; stroke-width:16; pointer-events:stroke; cursor:pointer; }
  .fl-temp { fill:none; stroke:var(--accent); stroke-width:2; stroke-dasharray:6 5; }
  .fl-token { fill:#ff7a45; }
  .fl-node { position:absolute; height:72px; box-sizing:border-box; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:8px 12px 8px 14px;
    cursor:grab; user-select:none; box-shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(20,30,60,.06); transition:box-shadow .2s, transform .2s, opacity .2s; }
  .fl-node::before { content:""; position:absolute; left:0; top:10px; bottom:10px; width:4px; border-radius:0 4px 4px 0; background:var(--k); }
  .fl-node:hover { box-shadow:0 2px 4px rgba(0,0,0,.06), 0 10px 24px rgba(20,30,60,.12); }
  .fl-node.sel { outline:2px solid var(--accent); outline-offset:2px; }
  .fl-node.k-human { background:linear-gradient(180deg,#fffaf0,#fff3d6); border-color:#efd496; }
  .fl-node.k-note { background:#fbfaf3; border-style:dashed; }
  .fl-node.k-code { border-style:dashed; }
  .fl-node.planned { opacity:.75; border-style:dashed; }
  .fl-node.live { border-color:var(--accent); opacity:1; animation:fl-pulse 1.6s ease-in-out infinite; }
  .fl-node.wait { border-color:#e0a020; animation:fl-pulse-w 1.8s ease-in-out infinite; }
  @keyframes fl-pulse { 50% { box-shadow:0 0 0 6px rgba(7,49,144,.12), 0 8px 22px rgba(7,49,144,.25); } }
  @keyframes fl-pulse-w { 50% { box-shadow:0 0 0 6px rgba(224,160,32,.2); } }
  .fl-node.playing { transform:translateY(-3px) scale(1.04); box-shadow:0 0 0 3px #ff7a45, 0 12px 26px rgba(255,122,69,.3); opacity:1; }
  .fl-node.played { opacity:.5; }
  @media (prefers-color-scheme: dark) { .fl-node.k-human { background:linear-gradient(180deg,#3a3220,#2f2918); border-color:#8a7340; } .fl-node.k-note { background:#25272b; } }
  .fl-node-h { display:flex; align-items:center; gap:6px; margin-bottom:3px; }
  .fl-node-h .fl-ic { width:20px; height:20px; font-size:11px; border-radius:6px; }
  .fl-kind { font-size:10.5px; color:var(--mute); }
  .fl-badge { margin-left:auto; font-size:10.5px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); color:var(--mute); white-space:nowrap; }
  .fl-badge.live { background:var(--accent); color:#fff; border-color:var(--accent); }
  .fl-badge.wait { background:#e0a020; color:#fff; border-color:#e0a020; }
  .fl-badge.new { color:#d6409f; border-color:#d6409f; }
  .fl-title { font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fl-who { font-size:11.5px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fl-node .port { position:absolute; top:50%; width:12px; height:12px; border-radius:50%; transform:translateY(-50%); background:var(--card); border:2px solid #b8bcc6; cursor:crosshair; z-index:2; box-sizing:border-box; }
  .fl-node .port.in { left:-7px; } .fl-node .port.out { right:-7px; background:var(--accent); border-color:#fff; box-shadow:0 0 0 1px var(--accent); }
  .fl-field { display:block; font-size:12px; color:var(--mute); margin-top:8px; }
  .fl-field input, .fl-field textarea, .fl-field select { display:block; width:100%; margin-top:3px; font:inherit; font-size:13px; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 8px; box-sizing:border-box; }
  .fl-legend { margin-top:10px; display:grid; gap:6px; }
  .fl-leg { display:flex; gap:8px; align-items:center; font-size:12.5px; }
  .fl-warn { position:sticky; left:0; bottom:0; background:#fff6df; color:#6b4e00; border-top:1px solid #e6c77a; padding:7px 12px; font-size:12.5px; }
  @media (prefers-color-scheme: dark) { .fl-warn, .fl-note.warn { background:#3a3220; color:#f0d58a; } }
  .hide { display:none !important; }
  h2 { font-size:16px; margin:20px 0 10px; }
</style>
</head>
<body>
<header>
  <span id="logo" class="logo">AH</span>
  <h1 id="title">Agent Hub</h1>
  <nav id="nav">
    <button data-tab="home" class="on">현황</button>
    <button data-tab="inbox">승인함<span id="badge" class="badge hide">0</span></button>
    <button data-tab="flow">흐름</button>
    <button data-tab="log">로그</button>
    <button data-tab="settings">설정</button>
  </nav>
  <span class="spacer"></span>
  <span class="small" id="usage"></span>
</header>
<div id="banner" class="banner hide"></div>
<main>
  <section id="login" class="hide"></section>
  <section id="home"></section>
  <section id="inbox" class="hide"></section>
  <section id="flow" class="hide"></section>
  <section id="log" class="hide"></section>
  <section id="settings" class="hide"></section>
</main>

<script src="/static/flow.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const STATUS = { queued:"대기", running:"작업 중", validating:"검수 중", awaiting_approval:"승인 대기", validation_failed:"검수 실패", approved:"승인됨", rejected:"반려됨", error:"오류" };
let state = null, tab = "home", selected = null, inboxFilter = "open", logFilter = "all";
let showPlanned = false; try { showPlanned = localStorage.getItem("showPlanned") === "1"; } catch {}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
async function api(path, body) {
  const opt = body ? { method:"POST", headers:{ "Content-Type":"application/json", "X-Hub":"1" }, body:JSON.stringify(body) } : {};
  const r = await fetch(path, opt);
  return { ok:r.ok, data: await r.json() };
}
const usd = (n) => (n == null ? "-" : "$" + Number(n).toFixed(2));
const t = (iso) => (iso || "").replace("T", " ").slice(5, 16);

function applyBranding(b, version) {
  if (!b) return;
  document.title = b.product_name || "Agent Hub";
  $("#title").textContent = (b.product_name || "Agent Hub") + (b.customer_name ? " · " + b.customer_name : "");
  $("#logo").textContent = (b.logo_text || "AH").slice(0, 3);
  if (b.accent) document.documentElement.style.setProperty("--accent", b.accent);
  if (version) $("#logo").title = "버전 " + version;
}

function showLogin(msg) {
  for (const id of ["home", "inbox", "flow", "log", "settings"]) $("#" + id).classList.add("hide");
  $("#nav").classList.add("hide");
  const box = $("#login"); box.classList.remove("hide"); box.replaceChildren();
  const pw = h("input", { type:"password", placeholder:"비밀번호", autofocus:true });
  const err = h("div", { class:"small", style:"color:var(--bad);margin-top:6px" }, msg || "");
  const go = async () => { const r = await api("/api/login", { password: pw.value }); if (r.ok) { box.classList.add("hide"); $("#nav").classList.remove("hide"); refresh(); } else err.textContent = r.data.error || "실패"; };
  pw.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  box.append(h("div", { class:"card login" }, h("h3", {}, "로그인"), h("div", { class:"small", style:"margin-bottom:10px" }, "관리 화면 비밀번호를 입력하세요."), pw, err, h("div", { class:"row", style:"margin-top:10px" }, h("button", { class:"btn primary", onclick:go }, "들어가기"))));
}

async function refresh() {
  let r;
  try { r = await api("/api/state"); } catch { return; }
  if (r.data && r.data.error === "로그인 필요") { const s = (await api("/api/session")).data; applyBranding(s.branding, s.version); showLogin(); return; }
  if (!r.ok) return;
  state = r.data;
  applyBranding(state.branding, state.version);
  const lic = state.license || {}, banner = $("#banner");
  if (lic.mode === "expired") { banner.className = "banner bad"; banner.textContent = "평가 기간이 끝났습니다. 설정 탭에서 라이선스 키를 입력하면 다시 실행할 수 있습니다."; }
  else if (lic.mode === "trial") { banner.className = "banner"; banner.textContent = `평가판 — ${lic.days_left}일 남음 (${lic.expires}까지). 라이선스 키는 설정 탭에서 입력합니다.`; }
  else banner.className = "banner hide";
  const waiting = state.runs.filter((r) => r.status === "awaiting_approval" || r.status === "validation_failed").length;
  const b = $("#badge"); b.textContent = waiting; b.classList.toggle("hide", !waiting);
  const u = state.usage;
  $("#usage").textContent = `오늘 ${usd(u.total_usd)} / 한도 ${usd(u.budget_usd)} · 갱신 ${new Date().toTimeString().slice(0, 5)}`;
  render();
}

function render() {
  if (!state) return;
  $("#login").classList.add("hide"); $("#nav").classList.remove("hide");
  for (const id of ["home", "inbox", "flow", "log", "settings"]) $("#" + id).classList.toggle("hide", id !== tab);
  if (tab === "home") renderHome();
  if (tab === "inbox") renderInbox();
  if (tab === "flow") renderFlow();
  if (tab === "settings") renderSettings();
  if (tab === "log") renderLog();
}

function renderHome() {
  const box = $("#home"); box.replaceChildren();
  const u = state.usage, pct = u.budget_usd ? Math.min(100, (u.total_usd / u.budget_usd) * 100) : 0;
  box.append(h("div", { class:"card" },
    h("h3", {}, "오늘 API 사용량"),
    h("div", { class:"bar" }, h("i", { style:`width:${pct}%` })),
    h("div", { class:"small" }, `${usd(u.total_usd)} / 한도 ${usd(u.budget_usd)} · 실행 ${Object.values(u.per_agent).reduce((a, x) => a + x.runs, 0)}건`)));
  for (const g of state.groups) {
    const total = g.agents.length, active = g.agents.filter((a) => a.state === "active").length;
    box.append(h("h2", {}, g.title, " ", h("span", { class:"small" }, `사용 중 ${active} / ${total}`)));
    if (g.purpose) box.append(h("div", { class:"small", style:"margin:-6px 0 10px" }, g.purpose));
    const grid = h("div", { class:"grid" });
    const planned = g.agents.filter((a) => a.state === "planned");
    for (const a of g.agents) {
      if (a.state === "planned" && !showPlanned) continue;
      const c = a.counts || {};
      const counts = Object.entries(c).map(([k, v]) => `${STATUS[k] || k} ${v}`).join(" · ") || "실행 없음";
      grid.append(h("div", { class:"card", style: a.name === g.lead ? "border-color:var(--accent)" : "" },
        h("div", { class:"row" }, h("h3", {}, a.title), a.name === g.lead ? h("span", { class:"pill optional" }, "리드") : null,
          h("span", { class:"pill " + a.state }, { active:"사용 중", optional:"선택", planned:"예정" }[a.state] || a.state)),
        h("div", { class:"small" }, a.name),
        h("p", {}, a.role),
        h("div", { class:"small" }, "도구: " + a.tools),
        h("div", { class:"small" }, "금지: " + a.forbidden),
        h("div", { class:"small" }, counts)));
    }
    box.append(grid);
    if (planned.length && !showPlanned) {
      box.append(h("div", { class:"small", style:"margin-top:8px" }, "예정: " + planned.map((a) => `${a.title}(${a.name})`).join(" · ")));
    }
  }
  box.append(h("div", { class:"row", style:"margin-top:14px" },
    h("button", { class:"btn", onclick:() => { showPlanned = !showPlanned; try { localStorage.setItem("showPlanned", showPlanned ? "1" : ""); } catch {} renderHome(); } }, showPlanned ? "예정 에이전트 접기" : "예정 에이전트 펼치기")));
  box.append(h("h2", {}, "최근 실행"));
  box.append(runTable(state.runs.slice(0, 10), (r) => { selected = r.id; tab = "inbox"; setTab(); }));
  box.append(h("h2", {}, "화면 시험(비용 없음)"));
  box.append(h("div", { class:"row" },
    h("button", { class:"btn", onclick:() => demo("ok") }, "통과 예시 만들기"),
    h("button", { class:"btn", onclick:() => demo("bad") }, "규칙 위반 예시 만들기"),
    h("span", { class:"small" }, "에이전트를 부르지 않는 가짜 데이터입니다.")));
}

function runTable(runs, onclick) {
  if (!runs.length) return h("div", { class:"small" }, "아직 실행 기록이 없습니다.");
  const tb = h("table", {}, h("thead", {}, h("tr", {}, ...["시각", "에이전트", "계정", "주제", "상태", "비용"].map((x) => h("th", {}, x)))));
  const body = h("tbody");
  for (const r of runs) {
    body.append(h("tr", { class:"click", onclick:() => onclick(r) },
      h("td", {}, t(r.created)), h("td", {}, r.agent), h("td", {}, r.account || ""), h("td", {}, r.topic || ""),
      h("td", { class:"st-" + r.status }, STATUS[r.status] || r.status), h("td", {}, usd(r.cost_usd))));
  }
  tb.append(body); return tb;
}

async function demo(scenario) { await api("/api/demo", { scenario }); setTimeout(refresh, 600); }

function renderInbox() {
  const box = $("#inbox"); box.replaceChildren();
  const open = ["awaiting_approval", "validation_failed"], done = ["approved", "rejected"];
  const list = state.runs.filter((r) => (inboxFilter === "open" ? open : done).includes(r.status));
  const left = h("div"), right = h("div", { id:"detail" });
  const seg = (key, label) => h("button", { class:"btn" + (inboxFilter === key ? " primary" : ""), onclick:() => { inboxFilter = key; selected = null; renderInbox(); } }, label);
  left.append(h("div", { class:"row", style:"margin-bottom:10px" }, seg("open", `처리할 것 ${state.runs.filter((r) => open.includes(r.status)).length}`), seg("done", "처리됨")));
  if (!selected && list.length) selected = list[0].id;
  if (!list.length) left.append(h("div", { class:"small" }, inboxFilter === "open" ? "처리할 결과물이 없습니다." : "처리된 기록이 없습니다."));
  for (const r of list) {
    left.append(h("div", { class:"card", style:"margin-bottom:10px;cursor:pointer;" + (r.id === selected ? "outline:2px solid var(--accent);" : ""), onclick:() => { selected = r.id; renderInbox(); } },
      h("div", { class:"row" }, h("b", { class:"st-" + r.status }, STATUS[r.status]), h("span", { class:"small" }, t(r.created))),
      h("div", {}, r.topic), h("div", { class:"small" }, `${r.account} · 오류 ${r.errors} · 경고 ${r.warnings}`)));
  }
  box.append(h("div", { class:"split" }, left, right));
  if (selected) loadDetail(selected, right);
  else right.append(h("div", { class:"small" }, "왼쪽에서 결과물을 선택하세요."));
}

async function loadDetail(id, box) {
  const { data } = await api("/api/runs/" + id);
  const run = data.run, pkg = data.package || {}, v = run.validation || { errors:[], warnings:[] };
  box.replaceChildren();
  const hook = pkg.hook || {};
  box.append(h("div", { class:"card" },
    h("div", { class:"row" }, h("h3", {}, pkg.topic || run.params.topic), h("span", { class:"st-" + run.status }, STATUS[run.status])),
    h("div", { class:"small" }, `${pkg.account} · ${pkg.series || ""} · ${pkg.type || ""} · 후킹 패턴: ${hook.pattern || "-"}`),
    h("p", {}, h("b", {}, hook.line1 || ""), h("br"), h("b", {}, hook.line2 || "")),
    h("div", { class:"small" }, "표지 제목: " + (pkg.cover_title || "-")),
    pkg.leader_intro ? h("div", { class:"small" }, "지도자 소개: " + pkg.leader_intro) : null,
    h("div", { class:"small" }, "BGM: " + JSON.stringify(pkg.bgm || {}) + " · 음성: " + (pkg.voice ? pkg.voice.name : "없음"))));
  // 이 건이 흐름의 어디에 있는지
  const grp = state.groups.find((g) => g.agents.some((a) => a.name === run.agent));
  if (grp && grp.flow_order && grp.flow_order.length) {
    // 실행 상태 → 담당 이름으로 현재 단계를 찾는다(흐름을 편집해도 따라간다)
    const whoFor = { queued:"reels-maker", running:"reels-maker", error:"reels-maker", validating:"reels-validator", validation_failed:"reels-validator", awaiting_approval:"사람", rejected:"사람" };
    let idx = grp.flow_order.findIndex((s) => s.who === whoFor[run.status]);
    if (run.status === "approved") idx = grp.flow_order.findIndex((s) => s.kind === "human") + 1;
    box.append(h("h2", {}, "진행 단계"), flowStrip(grp.flow_order, idx < 0 ? null : idx));
  }
  // 미리보기: 영상·표지가 있으면 보여주고, 없으면 첫 화면을 글자로 그려 준다
  const preview = h("div", { class:"card", style:"display:flex;gap:16px;align-items:center;flex-wrap:wrap" });
  const phone = h("div", { style:"width:150px;height:267px;border-radius:14px;background:#111;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;font-weight:700;font-size:13px;line-height:1.35;flex:none" },
    h("div", { style:"font-size:11px;opacity:.7;margin-bottom:auto" }, pkg.account || ""), h("div", {}, hook.line1 || ""), h("div", { style:"color:#ffd54a;margin-top:4px" }, hook.line2 || ""));
  const total = (pkg.scenes || []).reduce((a, s) => a + (Number(s.seconds) || 0), 0);
  const media = pkg.video_path ? h("video", { src:pkg.video_path, controls:true, style:"max-width:220px;border-radius:10px" }) : null;
  preview.append(phone, media || "", h("div", { class:"small" },
    h("div", {}, `전체 ${total.toFixed(1)}초 · 장면 ${(pkg.scenes || []).length}개`),
    h("div", {}, media ? "영상 파일: " + pkg.video_path : "영상 없음 — 승인 후 영상 제작 단계(reels-renderer)에서 만들어집니다."),
    h("div", {}, "왼쪽은 첫 화면(후킹)을 글자로 그린 것입니다.")));
  box.append(h("h2", {}, "미리보기"), preview);
  const tb = h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "#"), h("th", {}, "화면 글자"), h("th", {}, "초"), h("th", {}, "읽을 대본"))), h("tbody"));
  (pkg.scenes || []).forEach((s, i) => tb.lastChild.append(h("tr", {}, h("td", {}, i + 1), h("td", { style:"white-space:pre-line" }, s.text), h("td", {}, s.seconds), h("td", {}, s.voice_text || ""))));
  box.append(h("h2", {}, "장면"), tb);
  box.append(h("h2", {}, "캡션 / 소개 댓글"), h("div", { class:"card" }, h("div", {}, pkg.caption || ""), h("hr", { style:"border:0;border-top:1px solid var(--line)" }), h("div", {}, pkg.intro_comment || "(없음)")));
  box.append(h("h2", {}, "검수 결과"));
  const res = h("div", { class:"card" });
  if (!v.errors.length && !v.warnings.length) res.append(h("div", { class:"st-approved" }, "문제 없음"));
  if (v.errors.length) res.append(h("b", { class:"err" }, "오류(승인 불가)"), h("ul", { class:"clean" }, v.errors.map((e) => h("li", { class:"err" }, `[${e.rule}] ${e.msg}`))));
  if (v.warnings.length) res.append(h("b", { class:"wrn" }, "경고(확인 필요)"), h("ul", { class:"clean" }, v.warnings.map((e) => h("li", { class:"wrn" }, `[${e.rule}] ${e.msg}`))));
  if ((pkg.notes || []).length) res.append(h("b", {}, "에이전트 메모"), h("ul", { class:"clean" }, pkg.notes.map((n) => h("li", {}, n))));
  box.append(res);
  if (["awaiting_approval", "validation_failed"].includes(run.status)) {
    const note = h("input", { type:"text", placeholder:"메모(반려 사유 등)" });
    const msg = h("div", { class:"small" });
    const act = async (d) => { const r = await api(`/api/runs/${id}/decision`, { decision:d, note:note.value }); msg.textContent = r.ok ? "처리됨" : (r.data.error || "실패"); await refresh(); };
    box.append(h("h2", {}, "결정"), note, h("div", { class:"row", style:"margin-top:10px" },
      h("button", { class:"btn primary", disabled:run.status !== "awaiting_approval", onclick:() => act("approve") }, "승인(게시 준비 완료)"),
      h("button", { class:"btn", onclick:() => act("reject") }, "반려"), msg),
      h("div", { class:"small", style:"margin-top:8px" }, "승인은 게시가 아니라 「게시 준비 완료」 표시입니다. 게시·예약은 인스타 콘텐츠 예약에서 직접 합니다."));
  }
}

function flowStrip(flow, nowIdx) {
  const strip = h("div", { class:"flow" });
  (flow || []).forEach((s, i) => {
    const cls = "step k-" + s.kind + (nowIdx == null ? "" : i < nowIdx ? " done" : i === nowIdx ? " now" : "");
    strip.append(h("div", { class:cls }, h("b", {}, s.step), h("span", { class:"who" }, s.who)));
  });
  return strip;
}

let flowMounted = false;
function renderFlow() {
  if (flowMounted) return;  // 편집 중에는 5초 갱신으로 다시 그리지 않는다
  flowMounted = true;
  const box = $("#flow"); box.replaceChildren();
  const host = h("div"); box.append(host);
  FlowEditor.mount(host, state, () => refresh());
}

function renderSettings() {
  const box = $("#settings"); box.replaceChildren();
  const lic = state.license || {}, b = state.branding || {};
  const modeKo = { licensed:"정식", trial:"평가판", expired:"만료" }[lic.mode] || lic.mode;
  const key = h("input", { type:"text", placeholder:"AH1-YYYYMMDD-XXXX..." });
  const msg = h("div", { class:"small", style:"margin-top:6px" });
  box.append(h("h2", { style:"margin-top:0" }, "라이선스"),
    h("div", { class:"card" },
      h("div", {}, `상태: ${modeKo} · 고객사: ${lic.customer || "(미설정)"} · 만료: ${lic.expires || "-"} · 남은 일수: ${lic.days_left}`),
      lic.key_ok === false ? h("div", { class:"small", style:"color:var(--bad)" }, "입력된 키가 고객사 이름과 맞지 않습니다.") : null,
      h("div", { style:"margin-top:10px" }, key),
      h("div", { class:"row", style:"margin-top:8px" }, h("button", { class:"btn primary", onclick:async () => { const r = await api("/api/license", { key:key.value }); msg.textContent = r.ok ? "등록됨" : (r.data.error || "실패"); refresh(); } }, "키 등록"), msg),
      h("div", { class:"small", style:"margin-top:8px" }, "키는 고객사 이름(hub/config.json 의 branding.customer_name)과 짝입니다. 이름을 바꾸면 키를 다시 받아야 합니다.")));
  box.append(h("h2", {}, "제품 정보"),
    h("div", { class:"card" },
      h("div", {}, `제품명: ${b.product_name || "Agent Hub"} · 고객사: ${b.customer_name || "-"} · 버전: ${state.version}`),
      h("div", { class:"small", style:"margin-top:6px" }, "브랜딩(제품명·고객사·로고 글자·색)은 hub/config.json 의 branding 에서 바꿉니다. 비밀번호는 .env 의 HUB_PASSWORD 입니다.")));
  box.append(h("h2", {}, "운영 한도"),
    h("div", { class:"card" }, h("div", {}, `하루 API 한도: ${usd(state.usage.budget_usd)} · 포트: 127.0.0.1 전용`), h("div", { class:"small", style:"margin-top:6px" }, "hub/config.json 의 daily_budget_usd, port 에서 바꿉니다. 외부 접속은 열지 않습니다.")));
}

async function renderLog() {
  const box = $("#log"); box.replaceChildren();
  const seg = (key, label) => h("button", { class:"btn" + (logFilter === key ? " primary" : ""), onclick:() => { logFilter = key; renderLog(); } }, label);
  const blocked = state.events.filter((e) => e.kind === "blocked").length;
  box.append(h("div", { class:"row", style:"margin-bottom:10px" }, h("h2", { style:"margin:0 8px 0 0" }, "에이전트 활동"), seg("all", "전체"), seg("blocked", `차단만 ${blocked}`), seg("status", "상태만"), seg("tool", "도구만")));
  const tb = h("table", {}, h("thead", {}, h("tr", {}, ...["시각", "종류", "실행", "내용"].map((x) => h("th", {}, x)))), h("tbody"));
  const ko = (s) => String(s || "").replace(/^(\w+)/, (m) => STATUS[m] || m);
  for (const e of [...state.events].reverse()) {
    if (logFilter !== "all" && e.kind !== logFilter) continue;
    const detail = e.kind === "status" ? ko(e.detail) : [e.tool, e.reason, e.detail].filter(Boolean).join(" · ");
    tb.lastChild.append(h("tr", {}, h("td", {}, t(e.ts)), h("td", { class:"kind-" + e.kind }, { tool:"도구", blocked:"차단", status:"상태" }[e.kind] || e.kind), h("td", { class:"small" }, (e.run || "").slice(-8)), h("td", {}, detail)));
  }
  box.append(tb.lastChild.children.length ? tb : h("div", { class:"small" }, "기록이 없습니다."));
  box.append(h("h2", {}, "작업 기록(docs/work-log.md)"));
  const w = (await api("/api/worklog")).data.text;
  box.append(h("pre", {}, w || "(비어 있음)"));
}

function setTab() { document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab)); render(); }
document.querySelectorAll("#nav button").forEach((b) => b.addEventListener("click", () => { tab = b.dataset.tab; if (tab !== "flow") flowMounted = false; setTab(); }));
window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (["home", "inbox", "flow", "log", "settings"].includes(t) && state) { tab = t; if (tab !== "flow") flowMounted = false; setTab(); } });
if (["home", "inbox", "flow", "log", "settings"].includes(location.hash.slice(1))) { tab = location.hash.slice(1); setTab(); }
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
